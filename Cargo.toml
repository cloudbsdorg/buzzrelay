[package]
name = "buzzrelay"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/cloudbsdorg/buzzrelay"
homepage = "https://relay.fedi.buzz"

[dependencies]
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
tokio = { version = "1", features = ["full", "time"] }
tracing = "*"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "hickory-dns"] }
sigh = "1.0"
http_digest_headers = { version = "0.1.0", default-features = false, features = ["use_openssl"] }
thiserror = "2"
http = "1"
chrono = "0.4"
eventsource-stream = "0.2"
futures = "0.3"
tokio-postgres = "0.7"
metrics = "0.24"
metrics-util = "0.20"
metrics-exporter-prometheus = "0.18"
deunicode = "1.4"
urlencoding = "2"
httpdate = "1"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
lru = "0.18"
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
# readiness and watchdog notifications; only meaningful under systemd
systemd = { version = "0.10", optional = true }

[features]
default = ["systemd"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
